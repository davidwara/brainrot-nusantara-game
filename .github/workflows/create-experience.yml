name: Plan C — Create Experience (headless Studio)

# Membuat experience Roblox BARU tanpa PC dan tanpa Studio lokal.
# Rantai: GitHub Actions windows-latest -> install Roblox Studio (roblox-win-installer-action)
# -> run-in-roblox menjalankan ci/create-place.lua headless -> AssetService:CreatePlaceAsync
# mencetak BRAINROT_PLACE_ID (+ BRAINROT_UNIVERSE_ID bila lookup HTTP berhasil).
#
# Dipakai dua mode (workflow_dispatch):
#   test   — smoke test TANPA auth: cookie dummy, script ci/smoke-test.lua. Membuktikan
#            rantai install + headless run jalan di runner. TIDAK membuat apa pun.
#   create — membuat experience "Brainrot Nusantara" (atau sesuai input). WAJIB repo secret
#            ROBLOSECURITY berisi .ROBLOSECURITY cookie akun BorneoBrainrot. Cookie TIDAK
#            PERNAH ditulis ke log/repo — hanya dibaca action installer dari secrets.
#   qr-login — login Studio via KODE Quick Sign-in (kode muncul di Studio, user ketik
#            kode itu ke aplikasi Roblox HP yang sudah login sebagai BorneoBrainrot),
#            lalu buat experience seperti mode studio-zip. Cookie secret TIDAK dipakai
#            untuk login (mekanisme registry 2021 sudah mati di Studio modern).
#            Screenshot layar login di-push live ke branch qr-login-shots
#            (file qr-login-shot.png) supaya parent bisa membaca kodenya dan
#            meneruskannya ke user secepatnya; loop ~30 dtk/shot, maks ~22 menit.
#            Loop juga membaca perintah remote dari branch qr-login-cmd (file cmd.txt,
#            format "<seq> CLICK x y" / "<seq> KEY ...") untuk klik tombol
#            Quick Sign-in di layar login.
#   password-login — login Studio via username + password (secret ROBLOX_PASSWORD),
#            lalu buat experience seperti mode qr-login. Dipakai setelah Quick Sign-in
#            GAGAL (location mismatch: runner di data center luar negeri, HP user di
#            Indonesia — Roblox menolak kode) dan Create tab HP mentok (cuma ada
#            "Create in Studio"). Screenshot layar login di-push live ke branch
#            password-login-shots (file password-login-shot.png); loop membaca perintah
#            remote dari branch password-login-cmd (file cmd.txt, format
#            "<seq> CLICK x y" / "<seq> KEY ..." / "<seq> TYPEUSER" /
#            "<seq> TYPEPASSWORD"). TYPEPASSWORD mengetik secret ROBLOX_PASSWORD
#            langsung dari env — NILAI TIDAK PERNAH ditulis ke log/file/cmd.txt.
#            Kalau Roblox minta verifikasi (email/kode) karena IP data center,
#            screenshot akan menunjukkannya — parent yang minta kode ke user.
#   api-create — Plan D: buat experience via endpoint web
#            POST https://api.roblox.com/universes/create (cookie + CSRF token).
#            Dipakai karena installer Studio terbukti rusak (launcher tidak pernah
#            download Studio, diag 20 Nov) dan VM Muse tidak bisa mencapai
#            api.roblox.com (egress proxy balas empty reply). Runner GitHub punya
#            jaringan sendiri. Job ini jalan di ubuntu-latest (curl saja).
#
# Cara set secret + dispatch (parent saja, dari VM):
#   GH_TOKEN=$(cat ../.github-pat) gh secret set ROBLOSECURITY --repo davidwara/brainrot-nusantara-game
#   GH_TOKEN=$(cat ../.github-pat) gh workflow run create-experience.yml --repo davidwara/brainrot-nusantara-game \
#     --ref plan-c/create-experience -f mode=create
# Lalu cek hasil di tab Actions; place_id/universe_id ada di log + artefak place-ids.txt.
# Verifikasi independen: GET https://apis.roblox.com/universes/v1/places/{placeId}/universe
# dengan Open Cloud key (endpoint publik) atau cek Creator Dashboard.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = smoke test tanpa auth (cookie dummy); create = buat experience (butuh secrets.ROBLOSECURITY); diag = diagnosa installer Studio tanpa cookie; api-create = buat experience via endpoint web api.roblox.com/universes/create (butuh secrets.ROBLOSECURITY); studio-zip = buat experience via Studio dari zip langsung, tanpa launcher (butuh secrets.ROBLOSECURITY); diag-studio = diagnosa launch Studio dari zip (tanpa place, dengan place, via launcher) + event log — TIDAK membuat experience; diag-shot = screenshot jendela launcher (apa yang ditunggu launcher) + daftar jendela — TIDAK membuat experience; diag-thread = dump modul/thread/koneksi exe Studio yang macet 0 CPU — TIDAK membuat experience; diag-event = launch exe dengan argumen event launcher (-startEvent/-readyEvent/-showEvent) + screenshot — TIDAK membuat experience; qr-login = login Studio via kode Quick Sign-in (user ketik kode ke aplikasi Roblox HP) + buat experience; password-login = login Studio via username+password (secret ROBLOX_PASSWORD) + buat experience"
        type: choice
        options: [test, create, diag, api-create, studio-zip, diag-studio, diag-shot, diag-thread, diag-event, qr-login, password-login]
        default: test
      place_name:
        description: "Nama experience yang dibuat (mode create)"
        type: string
        default: "Brainrot Nusantara"
      template_place_id:
        description: "Template place ID (95206881 = Baseplate resmi Roblox)"
        type: string
        default: "95206881"

permissions:
  contents: read

jobs:
  create-experience:
    if: inputs.mode != 'api-create'
    runs-on: windows-latest
    timeout-minutes: 90
    # qr-login butuh push branch qr-login-shots (screenshot QR live) — override
    # workflow-level contents:read hanya untuk job ini.
    permissions:
      contents: write
    steps:
      - name: Checkout (branch plan-c)
        uses: actions/checkout@v4
        with:
          ref: plan-c/create-experience

      - name: Fail fast kalau mode=create tapi secret kosong
        if: inputs.mode == 'create' || inputs.mode == 'studio-zip'
        shell: pwsh
        run: |
          if ("${{ secrets.ROBLOSECURITY }}" -eq "") {
            Write-Error "ROBLOSECURITY secret is empty. Set repo secret dulu (lihat header workflow ini / ci/README-plan-c.md), lalu dispatch ulang mode=create."
            exit 1
          }
          Write-Host "ROBLOSECURITY secret terisi (nilai tidak dicetak)."

      - name: Fail fast kalau mode=password-login tapi secret kosong
        if: inputs.mode == 'password-login'
        shell: pwsh
        run: |
          if ("${{ secrets.ROBLOX_PASSWORD }}" -eq "") {
            Write-Error "ROBLOX_PASSWORD secret is empty. Set repo secret dulu (GitHub repo > Settings > Secrets and variables > Actions > New repository secret, nama ROBLOX_PASSWORD), lalu dispatch ulang mode=password-login."
            exit 1
          }
          Write-Host "ROBLOX_PASSWORD secret terisi (nilai tidak dicetak)."

      - name: Install Roblox Studio
        if: inputs.mode != 'diag' && inputs.mode != 'studio-zip' && inputs.mode != 'diag-studio' && inputs.mode != 'diag-shot' && inputs.mode != 'diag-thread' && inputs.mode != 'diag-event' && inputs.mode != 'qr-login' && inputs.mode != 'password-login'
        uses: OrbitalOwen/roblox-win-installer-action@1.1
        timeout-minutes: 20
        with:
          cookie: ${{ inputs.mode == 'create' && secrets.ROBLOSECURITY || 'DUMMY_COOKIE_FOR_MECHANICS_TEST' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Studio dari zip (tanpa launcher)
        if: inputs.mode == 'studio-zip' || inputs.mode == 'diag-studio' || inputs.mode == 'diag-shot' || inputs.mode == 'diag-thread' || inputs.mode == 'diag-event' || inputs.mode == 'qr-login' || inputs.mode == 'password-login'
        shell: pwsh
        timeout-minutes: 20
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          $version = (Invoke-WebRequest -Uri "http://setup.roblox.com/versionQTStudio" -UseBasicParsing).Content.Trim()
          if (-not $version) { Write-Error "versionQTStudio kosong — setup.roblox.com tidak merespons"; exit 1 }
          Write-Host "Studio version: $version"
          $dest = "$env:LOCALAPPDATA\Roblox\Versions\$version"
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          # Installer resmi mengunduh SEMUA package dari manifest rbxPkgManifest.txt
          # (zip versionQTStudio hanya 1 dari 32 package — tanpa Libraries.zip dkk,
          # exe gagal start: libfbxsdk.dll not found). Peta subdirektori dari Bloxstrap.
          $manifest = (Invoke-WebRequest -Uri "http://setup.roblox.com/$version-rbxPkgManifest.txt" -UseBasicParsing).Content -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if ($manifest[0] -ne "v0") { Write-Error "Format manifest tidak dikenal: $($manifest[0])"; exit 1 }
          $subdirs = @{
            "ssl.zip" = "ssl"; "ApplicationConfig.zip" = "ApplicationConfig"; "BuiltInPlugins.zip" = "BuiltInPlugins";
            "BuiltInStandalonePlugins.zip" = "BuiltInStandalonePlugins"; "Plugins.zip" = "Plugins"; "Qml.zip" = "Qml";
            "StudioFonts.zip" = "StudioFonts"; "content-avatar.zip" = "content\avatar"; "content-configs.zip" = "content\configs";
            "content-fonts.zip" = "content\fonts"; "content-models.zip" = "content\models";
            "content-qt_translations.zip" = "content\qt_translations"; "content-sky.zip" = "content\sky";
            "content-sounds.zip" = "content\sounds"; "shaders.zip" = "shaders"; "content-textures2.zip" = "content\textures";
            "content-textures3.zip" = "PlatformContent\pc\textures"; "content-studio_svg_textures.zip" = "content\studio_svg_textures";
            "content-terrain.zip" = "PlatformContent\pc\terrain"; "content-platform-fonts.zip" = "PlatformContent\pc\fonts";
            "content-api-docs.zip" = "content\api_docs"; "extracontent-scripts.zip" = "ExtraContent\scripts";
            "extracontent-luapackages.zip" = "ExtraContent\LuaPackages"; "extracontent-translations.zip" = "ExtraContent\translations";
            "extracontent-models.zip" = "ExtraContent\models"; "extracontent-textures.zip" = "ExtraContent\textures"
          }
          $skip = @("WebView2RuntimeInstaller.zip")
          # Expand-Archive GAGAL di ApplicationConfig.zip (run 44693646250): zip itu berisi
          # entri direktori "\" yang .NET anggap root drive -> error Zip Slip
          # ("Extracting Zip entry would have resulted in a file outside the specified
          # destination directory"). Ekstraksi manual di bawah me-skip entri yang
          # keluar dari destinasi (entri "\" tidak berbahaya, hanya marker direktori).
          function Expand-Pkg {
            param([string]$Zip, [string]$Dest)
            Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
            Add-Type -AssemblyName System.IO.Compression.ZipFile -ErrorAction SilentlyContinue
            $archive = [System.IO.Compression.ZipFile]::OpenRead($Zip)
            try {
              $destRoot = [System.IO.Path]::GetFullPath($Dest)
              foreach ($entry in $archive.Entries) {
                $destPath = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($Dest, $entry.FullName))
                if (-not $destPath.StartsWith($destRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host "SKIP entri di luar destinasi: $($entry.FullName)"
                  continue
                }
                if ($entry.Name -eq "") { continue }
                $dir = [System.IO.Path]::GetDirectoryName($destPath)
                if ($dir -and -not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force | Out-Null }
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destPath, $true)
              }
            } finally {
              $archive.Dispose()
            }
          }
          $count = 0
          for ($i = 1; $i -lt $manifest.Count; $i += 4) {
            $pkg = $manifest[$i]
            if (-not $pkg -or $skip -contains $pkg) { continue }
            Invoke-WebRequest -Uri "http://setup.roblox.com/$version-$pkg" -OutFile $pkg
            $sub = $subdirs[$pkg]
            $target = if ($sub) { Join-Path $dest $sub } else { $dest }
            if ($sub) { New-Item -Path $target -ItemType Directory -Force | Out-Null }
            Expand-Pkg -Zip $pkg -Dest $target
            Remove-Item $pkg -Force
            $count++
            Write-Host "Package OK: $pkg -> $target"
          }
          Write-Host "Total package ter-install: $count"
          $must = @("RobloxStudioBeta.exe","libfbxsdk.dll","Qt5Core.dll","Qt5Gui.dll","Qt5Widgets.dll","MSVCP140.dll","VCRUNTIME140.dll","WebView2Loader.dll")
          foreach ($f in $must) { if (-not (Test-Path (Join-Path $dest $f))) { Write-Error "File kunci hilang: $f"; exit 1 } }
          if (-not (Test-Path (Join-Path $dest "ssl\cacert.pem"))) { Write-Error "File kunci hilang: ssl\cacert.pem"; exit 1 }
          Write-Host "Verifikasi file kunci: LENGKAP"
          # AppSettings.xml TIDAK ada di package manapun — launcher resmi menulisnya
          # sendiri (writeAppSettings). Tanpa file ini Studio gagal start:
          # "'AppSettings.xml' not found. BaseURL is empty." Template diekstrak
          # dari string launcher resmi (RobloxStudioLauncherBeta.exe).
          $appSettingsLines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Settings>'
            "`t<ContentFolder>content</ContentFolder>"
            "`t<BaseUrl>http://www.roblox.com</BaseUrl>"
            '</Settings>'
          )
          $appSettingsLines -join "`n" | Set-Content -Path (Join-Path $dest "AppSettings.xml") -Encoding utf8
          Write-Host "AppSettings.xml ditulis ke $dest"
          $studioExe = Get-ChildItem $dest -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $studioExe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan setelah extract"; exit 1 }
          Write-Host "Studio exe: $($studioExe.FullName)"
          $cookie = $env:ROBLOSECURITY
          $key = "SEC::<YES>,EXP::<9999-01-01T00:00:00Z>,COOK::<$cookie>"
          $regPath = "HKCU:\Software\Roblox\RobloxStudioBrowser\roblox.com"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name ".ROBLOSECURITY" -Value $key
          Write-Host "Cookie ditulis ke registry (panjang nilai: $($key.Length))"
          $contentFolder = (Split-Path $studioExe.FullName -Parent) + "\content/"
          $regStudio = "HKCU:\Software\Roblox\RobloxStudio"
          if (-not (Test-Path $regStudio)) { New-Item -Path $regStudio -Force | Out-Null }
          Set-ItemProperty -Path $regStudio -Name "ContentFolder" -Value $contentFolder
          $pluginsDir = Join-Path $env:LOCALAPPDATA "Roblox\Plugins"
          if (-not (Test-Path $pluginsDir)) { New-Item -Path $pluginsDir -ItemType Directory -Force | Out-Null }
          $autoSaves = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "ROBLOX\AutoSaves"
          if (Test-Path $autoSaves) { Remove-Item $autoSaves -Recurse -Force }
          $settingsTemplate = Join-Path $env:GITHUB_WORKSPACE "ci\GlobalSettings_13.xml"
          if (-not (Test-Path $settingsTemplate)) { Write-Error "ci/GlobalSettings_13.xml tidak ditemukan di checkout"; exit 1 }
          $userDir = $env:USERPROFILE.Replace("\", "/")
          $settingsContent = (Get-Content $settingsTemplate -Raw).Replace("%UserProfile%", $userDir)
          $settingsDest = Join-Path $env:LOCALAPPDATA "Roblox\GlobalSettings_13.xml"
          Set-Content -Path $settingsDest -Value $settingsContent -Encoding utf8
          Write-Host "GlobalSettings_13.xml ditulis ke $settingsDest"
          $studioDir = Split-Path $studioExe.FullName -Parent
          $studioDir >> $env:GITHUB_PATH
          Write-Host "Studio dari zip SIAP."

      - name: Cek cookie valid
        if: inputs.mode == 'studio-zip' || inputs.mode == 'diag-studio' || inputs.mode == 'diag-shot' || inputs.mode == 'diag-thread' || inputs.mode == 'diag-event'
        shell: pwsh
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          $resp = curl.exe -s --max-time 20 -w "`nHTTP:%{http_code}" -H "Cookie: .ROBLOSECURITY=$env:ROBLOSECURITY" "https://users.roblox.com/v1/users/authenticated"
          Write-Host $resp
          if ($resp -match "HTTP:401") { Write-Error "Cookie TIDAK VALID (401) — butuh cookie baru dari user"; exit 1 }
          if ($resp -match "HTTP:200") { Write-Host "Cookie VALID." }

      - name: Code login loop (qr-login)
        id: qr-login
        if: inputs.mode == 'qr-login'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          Write-Host "Studio exe: $($exe.FullName)"
          $place = Join-Path $env:GITHUB_WORKSPACE "game.rbxl"
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          function Save-Shot([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shotPath = Join-Path $env:GITHUB_WORKSPACE $name
            $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "SCREENSHOT: $shotPath $((Get-Item $shotPath).Length) byte, $($bounds.Width)x$($bounds.Height)"
          }
          # Klik mouse via user32 (untuk klik tombol Quick Sign-in sesuai perintah remote).
          # C# ditulis sebagai array string (bukan here-string) supaya indentasi YAML aman.
          $mouseCode = @(
            "using System;",
            "using System.Runtime.InteropServices;",
            "public class MouseCtl {",
            "  [DllImport(`"user32.dll`")] public static extern bool SetCursorPos(int X, int Y);",
            "  [DllImport(`"user32.dll`")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);",
            "  public static void Click(int x, int y) {",
            "    SetCursorPos(x, y);",
            "    mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);",
            "    mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);",
            "  }",
            "}"
          ) -join "`n"
          Add-Type -TypeDefinition $mouseCode
          $wshell = New-Object -ComObject WScript.Shell
          # Git: push screenshot live ke branch qr-login-shots; baca perintah remote dari
          # branch qr-login-cmd (file cmd.txt, format "<seq> CLICK x y" / "<seq> KEY ...").
          git config user.email "qr-login@roblox.local"
          git config user.name "qr-login"
          git fetch --unshallow 2>$null | Out-Null
          git checkout -B qr-login-shots
          Write-Host "Branch qr-login-shots siap."
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $place -PassThru
          Write-Host "Studio diluncurkan pid=$($proc.Id) — tunggu 75 dtk sampai layar login muncul"
          Start-Sleep -Seconds 75
          $statusFile = Join-Path $env:GITHUB_WORKSPACE "qr-auth-status.txt"
          "authenticated=false" | Out-File -FilePath $statusFile -Encoding utf8
          $deadline = (Get-Date).AddMinutes(45)
          $shotIndex = 0
          $lastSeq = 0
          $authenticated = $false
          while ((Get-Date) -lt $deadline) {
            $shotIndex++
            $num = "{0:D3}" -f $shotIndex
            Save-Shot "qr-login-shot-$num.png"
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "qr-login-shot-$num.png") (Join-Path $env:GITHUB_WORKSPACE "qr-login-shot.png") -Force
            git add qr-login-shot.png 2>$null
            git commit --amend --no-edit --allow-empty -m "qr shot $shotIndex $(Get-Date -Format 'HH:mm:ss')" 2>$null | Out-Null
            git push --force origin qr-login-shots 2>&1 | Select-Object -Last 1
            Write-Host "SHOT $shotIndex di-push $(Get-Date -Format 'HH:mm:ss')"
            # Perintah remote (klik / tombol) dari branch qr-login-cmd
            git fetch origin qr-login-cmd 2>$null | Out-Null
            $cmdText = git show origin/qr-login-cmd:cmd.txt 2>$null
            if ($cmdText) {
              $parts = ($cmdText.Trim() -split "\s+")
              $seq = 0
              if ([int]::TryParse($parts[0], [ref]$seq) -and $seq -gt $lastSeq) {
                $lastSeq = $seq
                $action = $parts[1]
                if ($action -eq "CLICK" -and $parts.Count -ge 4) {
                  $x = [int]$parts[2]; $y = [int]$parts[3]
                  Write-Host "REMOTE CMD #$seq : CLICK $x $y"
                  $wshell.AppActivate("Roblox Studio") | Out-Null
                  Start-Sleep -Seconds 1
                  [MouseCtl]::Click($x, $y)
                  Write-Host "CLICK selesai."
                } elseif ($action -eq "KEY" -and $parts.Count -ge 3) {
                  $keys = ($parts[2..($parts.Count-1)] -join " ")
                  Write-Host "REMOTE CMD #$seq : KEY $keys"
                  $wshell.AppActivate("Roblox Studio") | Out-Null
                  Start-Sleep -Seconds 1
                  $wshell.SendKeys($keys)
                  Write-Host "KEY terkirim."
                } else {
                  Write-Host "REMOTE CMD #$seq : tidak dikenal/dilewati: $cmdText"
                }
              }
            }
            # Cek autentikasi: log Studio + file sesi
            $logDir = Join-Path $env:LOCALAPPDATA "Roblox\logs"
            $latest = Get-ChildItem $logDir -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) {
              $tail = Get-Content $latest.FullName -Tail 300 -ErrorAction SilentlyContinue
              if ($tail -match "Authenticated\s*:\s*YES") { $authenticated = $true; Write-Host "LOG: Authenticated YES terdeteksi." }
            }
            $cookieFile = Join-Path $env:LOCALAPPDATA "Roblox\RobloxCookies.dat"
            if (Test-Path $cookieFile) {
              $ageMin = ((Get-Date) - (Get-Item $cookieFile).LastWriteTime).TotalMinutes
              Write-Host "RobloxCookies.dat ada (umur $([math]::Round($ageMin,1)) mnt)"
              if ($ageMin -lt 30) { $authenticated = $true; Write-Host "SESI: file cookie baru terdeteksi." }
            }
            if ($authenticated) {
              "authenticated=true" | Out-File -FilePath $statusFile -Encoding utf8
              "authenticated=true" >> $env:GITHUB_OUTPUT
              Write-Host "AUTHENTICATED setelah shot $shotIndex — hentikan loop."
              break
            }
            $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $alive) { Write-Host "Studio sudah mati — keluar loop."; break }
            Start-Sleep -Seconds 20
          }
          "authenticated=$($authenticated.ToString().ToLower())" | Out-File -FilePath $statusFile -Encoding utf8
          "authenticated=$($authenticated.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "CODE LOGIN LOOP SELESAI: authenticated=$authenticated shots=$shotIndex"
          if ($authenticated) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Host "Studio interaktif dimatikan (sesi sudah tersimpan di disk)."
          }

      - name: Password login loop (password-login)
        id: password-login
        if: inputs.mode == 'password-login'
        shell: pwsh
        timeout-minutes: 50
        env:
          ROBLOX_PASSWORD: ${{ secrets.ROBLOX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          Write-Host "Studio exe: $($exe.FullName)"
          $place = Join-Path $env:GITHUB_WORKSPACE "game.rbxl"
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          function Save-Shot([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shotPath = Join-Path $env:GITHUB_WORKSPACE $name
            $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "SCREENSHOT: $shotPath $((Get-Item $shotPath).Length) byte, $($bounds.Width)x$($bounds.Height)"
          }
          # Klik mouse via user32 (untuk klik field username/password di form login).
          # C# ditulis sebagai array string (bukan here-string) supaya indentasi YAML aman.
          $mouseCode = @(
            "using System;",
            "using System.Runtime.InteropServices;",
            "public class MouseCtl {",
            "  [DllImport(`"user32.dll`")] public static extern bool SetCursorPos(int X, int Y);",
            "  [DllImport(`"user32.dll`")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);",
            "  public static void Click(int x, int y) {",
            "    SetCursorPos(x, y);",
            "    mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);",
            "    mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);",
            "  }",
            "}"
          ) -join "`n"
          Add-Type -TypeDefinition $mouseCode
          $wshell = New-Object -ComObject WScript.Shell
          # Git: push screenshot live ke branch password-login-shots; baca perintah remote
          # dari branch password-login-cmd (file cmd.txt, format "<seq> CLICK x y" /
          # "<seq> KEY ..." / "<seq> TYPEUSER" / "<seq> TYPEPASSWORD").
          # TYPEPASSWORD mengetik $env:ROBLOX_PASSWORD via SendKeys — NILAI TIDAK PERNAH
          # ditulis ke log/file/cmd.txt. SendKeys mengartikan + ^ % ~ ( ) { } secara
          # khusus, jadi karakter-karakter itu di-escape dulu dengan { }.
          git config user.email "password-login@roblox.local"
          git config user.name "password-login"
          git fetch --unshallow 2>$null | Out-Null
          git checkout -B password-login-shots
          Write-Host "Branch password-login-shots siap."
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $place -PassThru
          Write-Host "Studio diluncurkan pid=$($proc.Id) — tunggu 75 dtk sampai layar login muncul"
          Start-Sleep -Seconds 75
          $statusFile = Join-Path $env:GITHUB_WORKSPACE "password-auth-status.txt"
          "authenticated=false" | Out-File -FilePath $statusFile -Encoding utf8
          $deadline = (Get-Date).AddMinutes(45)
          $shotIndex = 0
          $lastSeq = 0
          $authenticated = $false
          while ((Get-Date) -lt $deadline) {
            $shotIndex++
            $num = "{0:D3}" -f $shotIndex
            Save-Shot "password-login-shot-$num.png"
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "password-login-shot-$num.png") (Join-Path $env:GITHUB_WORKSPACE "password-login-shot.png") -Force
            git add password-login-shot.png 2>$null
            git commit --amend --no-edit --allow-empty -m "pw shot $shotIndex $(Get-Date -Format 'HH:mm:ss')" 2>$null | Out-Null
            git push --force origin password-login-shots 2>&1 | Select-Object -Last 1
            Write-Host "SHOT $shotIndex di-push $(Get-Date -Format 'HH:mm:ss')"
            # Perintah remote (klik / tombol / ketik) dari branch password-login-cmd
            git fetch origin password-login-cmd 2>$null | Out-Null
            $cmdText = git show origin/password-login-cmd:cmd.txt 2>$null
            if ($cmdText) {
              $parts = ($cmdText.Trim() -split "\s+")
              $seq = 0
              if ([int]::TryParse($parts[0], [ref]$seq) -and $seq -gt $lastSeq) {
                $lastSeq = $seq
                $action = $parts[1]
                if ($action -eq "CLICK" -and $parts.Count -ge 4) {
                  $x = [int]$parts[2]; $y = [int]$parts[3]
                  Write-Host "REMOTE CMD #$seq : CLICK $x $y"
                  $wshell.AppActivate("Roblox Studio") | Out-Null
                  Start-Sleep -Seconds 1
                  [MouseCtl]::Click($x, $y)
                  Write-Host "CLICK selesai."
                } elseif ($action -eq "KEY" -and $parts.Count -ge 3) {
                  $keys = ($parts[2..($parts.Count-1)] -join " ")
                  Write-Host "REMOTE CMD #$seq : KEY $keys"
                  # JANGAN AppActivate di sini: AppActivate("Roblox Studio") mengaktifkan
                  # jendela UTAMA Studio dan mencuri fokus dari dialog login modal, sehingga
                  # SendKeys jatuh ke jendela utama (bukan ke field). Field sudah difokuskan
                  # oleh CLICK sebelumnya — SendKeys langsung ke kontrol yang fokus.
                  $wshell.SendKeys($keys)
                  Write-Host "KEY terkirim."
                } elseif ($action -eq "TYPEUSER") {
                  Write-Host "REMOTE CMD #$seq : TYPEUSER (BorneoBrainrot)"
                  # Tanpa AppActivate (lihat komentar di KEY): ketik ke field yang sudah fokus.
                  $wshell.SendKeys("BorneoBrainrot")
                  Write-Host "TYPEUSER terkirim."
                } elseif ($action -eq "TYPEPASSWORD") {
                  Write-Host "REMOTE CMD #$seq : TYPEPASSWORD (ketik secret, nilai tidak dicetak)"
                  # Tanpa AppActivate (lihat komentar di KEY): ketik ke field yang sudah fokus.
                  $pw = $env:ROBLOX_PASSWORD
                  $esc = ""
                  foreach ($ch in $pw.ToCharArray()) {
                    if ($ch -in @('+','^','%','~','(',')','{','}')) { $esc += "{$ch}" } else { $esc += $ch }
                  }
                  $wshell.SendKeys($esc)
                  Write-Host "TYPEPASSWORD terkirim."
                } else {
                  Write-Host "REMOTE CMD #$seq : tidak dikenal/dilewati."
                }
              }
            }
            # Cek autentikasi: log Studio + file sesi (sama seperti qr-login)
            $logDir = Join-Path $env:LOCALAPPDATA "Roblox\logs"
            $latest = Get-ChildItem $logDir -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) {
              $tail = Get-Content $latest.FullName -Tail 300 -ErrorAction SilentlyContinue
              if ($tail -match "Authenticated\s*:\s*YES") { $authenticated = $true; Write-Host "LOG: Authenticated YES terdeteksi." }
            }
            $cookieFile = Join-Path $env:LOCALAPPDATA "Roblox\RobloxCookies.dat"
            if (Test-Path $cookieFile) {
              $ageMin = ((Get-Date) - (Get-Item $cookieFile).LastWriteTime).TotalMinutes
              Write-Host "RobloxCookies.dat ada (umur $([math]::Round($ageMin,1)) mnt)"
              if ($ageMin -lt 30) { $authenticated = $true; Write-Host "SESI: file cookie baru terdeteksi." }
            }
            if ($authenticated) {
              "authenticated=true" | Out-File -FilePath $statusFile -Encoding utf8
              "authenticated=true" >> $env:GITHUB_OUTPUT
              Write-Host "AUTHENTICATED setelah shot $shotIndex — hentikan loop."
              break
            }
            $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $alive) { Write-Host "Studio sudah mati — keluar loop."; break }
            Start-Sleep -Seconds 20
          }
          "authenticated=$($authenticated.ToString().ToLower())" | Out-File -FilePath $statusFile -Encoding utf8
          "authenticated=$($authenticated.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "PASSWORD LOGIN LOOP SELESAI: authenticated=$authenticated shots=$shotIndex"
          if ($authenticated) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Host "Studio interaktif dimatikan (sesi sudah tersimpan di disk)."
          }

      - name: Pre-warm Studio
        if: inputs.mode == 'studio-zip'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          $place = Join-Path $env:GITHUB_WORKSPACE "game.rbxl"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $place -PassThru
          Write-Host "Pre-warm Studio pid=$($proc.Id)"
          Start-Sleep -Seconds 60
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          Write-Host "Studio masih jalan setelah 60 dtk: $($null -ne $alive)"
          Write-Host "=== DIAGNOSTIK STUDIO (60 dtk) ==="
          Get-Process Roblox* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "PROC: $($_.Name) pid=$($_.Id) cpu=$($_.CPU)s ws=$([math]::Round($_.WorkingSet64/1MB))MB title='$($_.MainWindowTitle)'" }
          $robloxRoot = Join-Path $env:LOCALAPPDATA "Roblox"
          Write-Host "=== File di $robloxRoot (rekursif, 40 terbaru) ==="
          Get-ChildItem $robloxRoot -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 40 | ForEach-Object { Write-Host "$($_.LastWriteTime.ToString('HH:mm:ss')) $($_.Length) $($_.FullName)" }
          Write-Host "=== Registry RobloxStudio ==="
          Get-ItemProperty "HKCU:\Software\Roblox\RobloxStudio" -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          $logDir = Join-Path $env:LOCALAPPDATA "Roblox\logs"
          $latest = Get-ChildItem $logDir -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latest) {
            Write-Host "Log terbaru: $($latest.Name)"
            Get-Content $latest.FullName -Tail 30 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "Tidak ada file log Studio di $logDir"
          }
          if ($alive) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; Write-Host "Pre-warm Studio dimatikan." }
          Start-Sleep -Seconds 5
          $still = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
          Write-Host "Studio masih ada setelah kill: $($null -ne $still)"

      - name: Diagnostik launch Studio (diag-studio)
        if: inputs.mode == 'diag-studio'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          $studioDir = Split-Path $exe.FullName -Parent
          $place = Join-Path $env:GITHUB_WORKSPACE "game.rbxl"
          function Dump-Studio {
            param([string]$label)
            Write-Host "=== $label ==="
            $procs = Get-Process Roblox* -ErrorAction SilentlyContinue
            if ($procs) { $procs | ForEach-Object { Write-Host "PROC: $($_.Name) pid=$($_.Id) cpu=$($_.CPU)s ws=$([math]::Round($_.WorkingSet64/1MB))MB title='$($_.MainWindowTitle)'" } } else { Write-Host "PROC: (tidak ada proses Roblox)" }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA "Roblox") -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 15 | ForEach-Object { Write-Host "FILE: $($_.LastWriteTime.ToString('HH:mm:ss')) $($_.Length) $($_.FullName)" }
          }
          Write-Host "--- Test 0: Zone.Identifier (Mark of the Web) di exe ---"
          $motw = Get-Item $exe.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($motw) { Write-Host "MOTW: ADA" } else { Write-Host "MOTW: tidak ada" }
          Unblock-File -Path $exe.FullName -ErrorAction SilentlyContinue
          Write-Host "Unblock-File selesai."
          Write-Host "--- Test A: launch TANPA place (30 dtk) ---"
          $procA = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          Dump-Studio -label "Test A (tanpa place, 30 dtk)"
          Stop-Process -Name RobloxStudioBeta -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Write-Host "--- Test B: launch DENGAN place + WorkingDirectory=studioDir (60 dtk) ---"
          $procB = Start-Process -FilePath $exe.FullName -ArgumentList $place -WorkingDirectory $studioDir -PassThru
          Start-Sleep -Seconds 60
          Dump-Studio -label "Test B (dengan place, CWD=studioDir, 60 dtk)"
          Stop-Process -Name RobloxStudioBeta -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Write-Host "--- Test C: launcher (10x60 dtk, pantau progres + koneksi) ---"
          Invoke-WebRequest -Uri "http://setup.roblox.com/RobloxStudioLauncherBeta.exe" -OutFile RobloxStudioLauncherBeta.exe
          $procC = Start-Process -FilePath ".\RobloxStudioLauncherBeta.exe" -PassThru
          for ($i = 1; $i -le 10; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "=== Test C menit $i ==="
            Get-Process Roblox* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "PROC: $($_.Name) pid=$($_.Id) cpu=$($_.CPU)s ws=$([math]::Round($_.WorkingSet64/1MB))MB title='$($_.MainWindowTitle)'" }
            Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "VERSIONS: $($_.Name)" }
            $launcherPids = (Get-Process RobloxStudioLauncherBeta -ErrorAction SilentlyContinue).Id
            foreach ($lp in $launcherPids) {
              Get-NetTCPConnection -OwningProcess $lp -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "NET: pid=$lp $($_.RemoteAddress):$($_.RemotePort) $($_.State)" }
            }
            $studio = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
            if ($studio) { Write-Host "STUDIO MUNCUL: pid=$($studio.Id) cpu=$($studio.CPU)s"; break }
          }
          Stop-Process -Name RobloxStudioLauncherBeta -Force -ErrorAction SilentlyContinue
          Stop-Process -Name RobloxStudioBeta -Force -ErrorAction SilentlyContinue
          Write-Host "--- Event log Application (15 menit terakhir, Roblox/Error) ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Roblox' -or $_.LevelDisplayName -eq 'Error' } | Select-Object -First 10 | ForEach-Object { Write-Host "$($_.TimeCreated.ToString('HH:mm:ss')) $($_.ProviderName) $($_.Id) $($_.Message.Substring(0, [Math]::Min(200, $_.Message.Length)))" }
          Write-Host "DIAG-STUDIO SELESAI."

      - name: Screenshot launcher (diag-shot)
        if: inputs.mode == 'diag-shot'
        shell: pwsh
        timeout-minutes: 5
        run: |
          Invoke-WebRequest -Uri "http://setup.roblox.com/RobloxStudioLauncherBeta.exe" -OutFile RobloxStudioLauncherBeta.exe
          $procC = Start-Process -FilePath ".\RobloxStudioLauncherBeta.exe" -PassThru
          Start-Sleep -Seconds 60
          Get-Process Roblox* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "PROC: $($_.Name) pid=$($_.Id) cpu=$($_.CPU)s ws=$([math]::Round($_.WorkingSet64/1MB))MB title='$($_.MainWindowTitle)'" }
          Write-Host "--- Semua jendela terlihat ---"
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "WIN: $($_.ProcessName) pid=$($_.Id) title='$($_.MainWindowTitle)'" }
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          function Save-Shot([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shotPath = Join-Path $env:GITHUB_WORKSPACE $name
            $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "SCREENSHOT: $shotPath $((Get-Item $shotPath).Length) byte, $($bounds.Width)x$($bounds.Height)"
          }
          Save-Shot "launcher-shot.png"
          Write-Host "--- Dismiss dialog error (Enter) lalu tunggu 30 dtk ---"
          $wshell = New-Object -ComObject WScript.Shell
          $activated = $wshell.AppActivate("Roblox")
          Write-Host "AppActivate Roblox: $activated"
          Start-Sleep -Seconds 1
          $wshell.SendKeys("{ENTER}")
          Start-Sleep -Seconds 30
          Get-Process Roblox* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "PROC2: $($_.Name) pid=$($_.Id) cpu=$($_.CPU)s ws=$([math]::Round($_.WorkingSet64/1MB))MB title='$($_.MainWindowTitle)'" }
          $studio = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
          if ($studio) { Get-NetTCPConnection -OwningProcess $studio.Id -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "STUDIO-NET: $($_.RemoteAddress):$($_.RemotePort) $($_.State)" } }
          Save-Shot "launcher-shot2.png"
          Stop-Process -Name RobloxStudioLauncherBeta -Force -ErrorAction SilentlyContinue
          Stop-Process -Name RobloxStudioBeta -Force -ErrorAction SilentlyContinue
          Write-Host "DIAG-SHOT SELESAI."

      - name: Diagnostik thread exe (diag-thread)
        if: inputs.mode == 'diag-thread'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          Write-Host "EXE: $($exe.FullName) $((Get-Item $exe.FullName).Length) byte"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Write-Host "STARTED pid=$($proc.Id)"
          Start-Sleep -Seconds 30
          $p = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $p) { Write-Host "PROC: sudah keluar (exit code tidak diketahui)"; exit 0 }
          Write-Host "PROC: $($p.ProcessName) pid=$($p.Id) cpu=$($p.CPU)s ws=$([math]::Round($p.WorkingSet64/1MB))MB title='$($p.MainWindowTitle)' threads=$($p.Threads.Count)"
          Write-Host "--- Modul ter-load (20 pertama) ---"
          $p.Modules | Select-Object -First 20 | ForEach-Object { Write-Host "MOD: $($_.FileName)" }
          Write-Host "--- Thread (state / wait reason / waktu) ---"
          Get-CimInstance Win32_Thread -Filter "ProcessHandle=$($p.Id)" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "THREAD: id=$($_.Handle) state=$($_.ThreadState) wait=$($_.ThreadWaitReason) kernel=$($_.KernelModeTime) user=$($_.UserModeTime)" }
          Write-Host "--- Koneksi jaringan exe ---"
          Get-NetTCPConnection -OwningProcess $p.Id -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "NET: $($_.LocalAddress):$($_.LocalPort) -> $($_.RemoteAddress):$($_.RemotePort) $($_.State)" }
          Write-Host "(tidak ada koneksi = exe belum sampai networking)"
          Write-Host "--- Parent + command line ---"
          $cim = Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" -ErrorAction SilentlyContinue
          Write-Host "PARENT: pid=$($cim.ParentProcessId) cmdline='$($cim.CommandLine)'"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "DIAG-THREAD SELESAI."

      - name: Launch exe dengan event launcher (diag-event)
        if: inputs.mode == 'diag-event'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "RobloxStudioBeta.exe tidak ditemukan"; exit 1 }
          Write-Host "EXE: $($exe.FullName)"
          $startEv = New-Object System.Threading.EventWaitHandle($true, [System.Threading.EventResetMode]::ManualReset, "RobloxDiagStartEvent")
          $readyEv = New-Object System.Threading.EventWaitHandle($true, [System.Threading.EventResetMode]::ManualReset, "RobloxDiagReadyEvent")
          $showEv = New-Object System.Threading.EventWaitHandle($true, [System.Threading.EventResetMode]::ManualReset, "RobloxDiagShowEvent")
          Write-Host "EVENT: 3 named event dibuat (ManualReset, sudah ter-signal)"
          $args = "-startEvent RobloxDiagStartEvent -readyEvent RobloxDiagReadyEvent -showEvent RobloxDiagShowEvent"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList $args -PassThru
          Write-Host "STARTED pid=$($proc.Id) args='$args'"
          Start-Sleep -Seconds 30
          $p = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $p) { Write-Host "PROC: sudah keluar"; exit 0 }
          Write-Host "PROC: $($p.ProcessName) pid=$($p.Id) cpu=$($p.CPU)s ws=$([math]::Round($p.WorkingSet64/1MB))MB title='$($p.MainWindowTitle)' threads=$($p.Threads.Count) modules=$(@($p.Modules).Count)"
          Write-Host "--- Semua jendela terlihat ---"
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "WIN: $($_.ProcessName) pid=$($_.Id) title='$($_.MainWindowTitle)'" }
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shotPath = Join-Path $env:GITHUB_WORKSPACE "studio-event-shot.png"
          $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()
          Write-Host "SCREENSHOT: $shotPath $((Get-Item $shotPath).Length) byte"
          $startEv.Dispose(); $readyEv.Dispose(); $showEv.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "DIAG-EVENT SELESAI."

      - name: Diagnostik installer Studio (tanpa cookie)
        if: inputs.mode == 'diag'
        shell: pwsh
        timeout-minutes: 15
        run: |
          Invoke-WebRequest -Uri "http://setup.roblox.com/RobloxStudioLauncherBeta.exe" -OutFile RobloxStudioLauncherBeta.exe
          $proc = Start-Process -FilePath ".\RobloxStudioLauncherBeta.exe" -PassThru
          Write-Host "launcher pid=$($proc.Id)"
          $deadline = (Get-Date).AddMinutes(12)
          $found = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            $studio = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue
            $launcher = Get-Process RobloxStudioLauncherBeta -ErrorAction SilentlyContinue
            $versions = @(Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            Write-Host "t=$((Get-Date).ToString('HH:mm:ss')) studio=$($null -ne $studio) launcher=$($null -ne $launcher) versions=[$($versions -join ',')]"
            if ($studio) { $found = $true; break }
          }
          if (-not $found) {
            Write-Host "=== DIAGNOSTIK AKHIR ==="
            Get-Process Roblox* -ErrorAction SilentlyContinue | Format-Table Name, Id | Out-String | Write-Host
            Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions\*\RobloxStudioBeta.exe" -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table | Out-String | Write-Host
            Write-Error "RobloxStudioBeta.exe TIDAK MUNCUL dalam 12 menit tanpa cookie — launcher sendiri yang bermasalah"
            exit 1
          }
          Write-Host "STUDIO MUNCUL — launcher jalan tanpa cookie, berarti tulis registry cookie yang merusak startup"
          Stop-Process -Name RobloxStudioBeta -Force -ErrorAction SilentlyContinue

      - name: Install run-in-roblox via Foreman
        if: inputs.mode != 'diag' && inputs.mode != 'diag-studio' && inputs.mode != 'diag-shot' && inputs.mode != 'diag-thread' && inputs.mode != 'diag-event'
        uses: rojo-rbx/setup-foreman@v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run script in headless Studio
        if: inputs.mode != 'diag' && inputs.mode != 'diag-studio' && inputs.mode != 'diag-shot' && inputs.mode != 'diag-thread' && inputs.mode != 'diag-event' && (inputs.mode != 'qr-login' || steps.qr-login.outputs.authenticated == 'true') && (inputs.mode != 'password-login' || steps.password-login.outputs.authenticated == 'true')
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Continue"
          if ("${{ inputs.mode }}" -eq "create" -or "${{ inputs.mode }}" -eq "studio-zip" -or "${{ inputs.mode }}" -eq "qr-login" -or "${{ inputs.mode }}" -eq "password-login") {
            $env:PLAN_C_PLACE_NAME = "${{ inputs.place_name }}"
            $env:PLAN_C_TEMPLATE_ID = "${{ inputs.template_place_id }}"
            run-in-roblox --place game.rbxl --script ci/create-place.lua *> run.log
          } else {
            run-in-roblox --place game.rbxl --script ci/smoke-test.lua *> run.log
          }
          $code = $LASTEXITCODE
          Get-Content run.log
          Write-Host "run-in-roblox exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Extract place/universe IDs dari log
        id: extract
        if: always() && inputs.mode != 'diag' && inputs.mode != 'diag-studio'
        shell: pwsh
        run: |
          $log = Get-Content run.log -Raw -ErrorAction SilentlyContinue
          if ($null -eq $log) { $log = "" }
          $place = [regex]::Match($log, "BRAINROT_PLACE_ID=(\d+)").Groups[1].Value
          $uni = [regex]::Match($log, "BRAINROT_UNIVERSE_ID=(\d+)").Groups[1].Value
          $smoke = [regex]::Match($log, "BRAINROT_SMOKE_OK=1").Success
          "place_id=$place" >> $env:GITHUB_OUTPUT
          "universe_id=$uni" >> $env:GITHUB_OUTPUT
          "smoke_ok=$smoke" >> $env:GITHUB_OUTPUT
          @"
          mode=${{ inputs.mode }}
          place_id=$place
          universe_id=$uni
          smoke_ok=$smoke
          "@ | Out-File -FilePath place-ids.txt -Encoding utf8
          Get-Content place-ids.txt
          if (("${{ inputs.mode }}" -eq "create" -or "${{ inputs.mode }}" -eq "studio-zip" -or "${{ inputs.mode }}" -eq "qr-login" -or "${{ inputs.mode }}" -eq "password-login") -and $place -eq "") {
            Write-Error "Mode ${{ inputs.mode }} tapi BRAINROT_PLACE_ID tidak ditemukan di log — CreatePlaceAsync gagal / Studio belum login. Lihat run.log."
            exit 1
          }
          if ("${{ inputs.mode }}" -eq "test" -and -not $smoke) {
            Write-Error "Smoke test gagal — BRAINROT_SMOKE_OK tidak ditemukan di log. Lihat run.log."
            exit 1
          }

      - name: Upload log + IDs sebagai artefak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-c-run-log
          path: |
            run.log
            place-ids.txt
            launcher-shot.png
            launcher-shot2.png
            studio-event-shot.png
            qr-login-shot*.png
            qr-auth-status.txt
            password-login-shot*.png
            password-auth-status.txt
          retention-days: 7

  api-create:
    if: inputs.mode == 'api-create'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail fast kalau secret kosong
        shell: bash
        run: |
          if [ -z "${{ secrets.ROBLOSECURITY }}" ]; then
            echo "::error::ROBLOSECURITY secret kosong."
            exit 1
          fi
          echo "ROBLOSECURITY secret terisi (nilai tidak dicetak)."

      - name: Diagnostik jaringan runner
        shell: bash
        run: |
          for H in api.roblox.com apis.roblox.com www.roblox.com create.roblox.com; do
            echo "--- $H ---"
            getent hosts "$H" || echo "DNS gagal (getent)"
            nslookup "$H" 2>&1 | grep -E "Address|can't|NXDOMAIN" | head -3 || true
            curl -s -o /dev/null --max-time 15 -w "root GET: HTTP:%{http_code}\n" "https://$H/" || echo "curl gagal exit $?"
          done

      - name: Buat experience via api.roblox.com/universes/create
        id: create
        shell: bash
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          PLACE_NAME: ${{ inputs.place_name }}
          TEMPLATE_ID: ${{ inputs.template_place_id }}
        run: |
          BODY="{\"templatePlaceIdToUse\": $TEMPLATE_ID}"
          echo "--- POST tanpa CSRF (ambil token) ---"
          RESP=$(curl -s -i --max-time 30 -X POST "https://api.roblox.com/universes/create" -H "Cookie: .ROBLOSECURITY=$ROBLOSECURITY" -H "Content-Type: application/json" -d "$BODY")
          echo "$RESP" | grep -i '^HTTP/' | tail -1
          CSRF=$(echo "$RESP" | grep -i '^x-csrf-token:' | tr -d '\r' | awk '{print $2}')
          echo "csrf_len=${#CSRF}"
          if [ -z "$CSRF" ]; then
            echo "--- respons lengkap (tanpa CSRF) ---"
            echo "$RESP" | tail -5
            echo "::error::Tidak dapat CSRF token — cookie mungkin tidak valid atau endpoint menolak."
            exit 1
          fi
          echo "--- POST dengan CSRF (buat universe) ---"
          curl -s --max-time 30 -X POST "https://api.roblox.com/universes/create" -H "Cookie: .ROBLOSECURITY=$ROBLOSECURITY" -H "X-CSRF-TOKEN: $CSRF" -H "Content-Type: application/json" -d "$BODY" -o api-create-response.json -w "HTTP:%{http_code}\n"
          echo "--- respons ---"
          cat api-create-response.json
          echo ""
          UNIVERSE_ID=$(python3 -c "import json; d=json.load(open('api-create-response.json')); print(d.get('universeId','') or d.get('UniverseId',''))" 2>/dev/null || echo "")
          PLACE_ID=$(python3 -c "import json; d=json.load(open('api-create-response.json')); print(d.get('rootPlaceId','') or d.get('RootPlaceId','') or d.get('placeId',''))" 2>/dev/null || echo "")
          echo "universe_id=$UNIVERSE_ID" >> "$GITHUB_OUTPUT"
          echo "place_id=$PLACE_ID" >> "$GITHUB_OUTPUT"
          printf "mode=api-create\nuniverse_id=%s\nplace_id=%s\n" "$UNIVERSE_ID" "$PLACE_ID" > place-ids.txt
          cat place-ids.txt
          if [ -z "$UNIVERSE_ID" ]; then
            echo "::error::universeId tidak ditemukan di respons — lihat api-create-response.json."
            exit 1
          fi

      - name: Upload respons sebagai artefak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-c-api-create
          path: |
            api-create-response.json
            place-ids.txt
          retention-days: 7
