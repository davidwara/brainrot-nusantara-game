name: Diag Protocol — roblox-studio:// handler

# Diagnosa Plan D v3 (20 Nov 2026): uji MEKANISME handler protokol
# roblox-studio:// di runner windows-latest TANPA butuh Studio terinstall.
# Handler didaftarkan manual mengarah ke script penerima yang mencatat URL
# yang diterimanya ke file — membuktikan rantai registry -> shell ->
# proses -> argumen URL bekerja atau tidak.
# TIDAK login, TIDAK pakai secret apa pun, TIDAK membuat experience.
# Hasil: log + screenshot, di-upload sebagai artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-protocol:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Tes A — Start-Process roblox-studio:// TANPA handler (harapan: error)
        shell: pwsh
        run: |
          Write-Host "=== TES A: Start-Process 'roblox-studio://' tanpa handler ==="
          foreach ($p in @("HKCR:\roblox-studio", "HKCU:\Software\Classes\roblox-studio", "HKLM:\SOFTWARE\Classes\roblox-studio")) {
            if (Test-Path $p) { Write-Host "ADA: $p" } else { Write-Host "TIDAK ADA: $p" }
          }
          try {
            Start-Process "roblox-studio://"
            Write-Host "TES A: Start-Process TIDAK error (tidak terduga tanpa handler)"
          } catch {
            Write-Host "TES A: Start-Process ERROR (sesuai harapan tanpa handler): $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 5
          Write-Host "TES A SELESAI."

      - name: Tes B — Daftarkan handler manual ke script penerima, lalu picu
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          function Save-Shot([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shotPath = Join-Path $env:GITHUB_WORKSPACE $name
            $bmp.Save($shotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "SCREENSHOT: $name $((Get-Item $shotPath).Length) byte"
          }
          Write-Host "=== TES B: buat script penerima + daftarkan handler manual ==="
          $receiver = Join-Path $env:RUNNER_TEMP "protocol-receiver.ps1"
          $logFile = Join-Path $env:RUNNER_TEMP "protocol-received.txt"
          @"
          param([string]`$url)
          "`$(Get-Date -Format o) URL=`$url" | Out-File -FilePath "$logFile" -Append -Encoding utf8
          "@ | Out-File -FilePath $receiver -Encoding utf8
          Write-Host "RECEIVER: $receiver"
          Write-Host "LOGFILE: $logFile"
          $pwsh = (Get-Command pwsh).Source
          Write-Host "PWSH: $pwsh"
          $base = "HKCU:\Software\Classes\roblox-studio"
          New-Item -Path $base -Force | Out-Null
          Set-ItemProperty -Path $base -Name "(default)" -Value "URL:Roblox Studio"
          New-ItemProperty -Path $base -Name "URL Protocol" -Value "" -PropertyType String -Force | Out-Null
          New-Item -Path "$base\shell\open\command" -Force | Out-Null
          $cmdValue = "`"$pwsh`" -NoProfile -ExecutionPolicy Bypass -File `"$receiver`" `"%1`""
          Set-ItemProperty -Path "$base\shell\open\command" -Name "(default)" -Value $cmdValue
          $check = Get-ItemProperty "$base\shell\open\command"
          Write-Host "TERDAFTAR: $($check.'(default)')"
          Write-Host "--- Picu: Start-Process 'roblox-studio://diag-ticket-123' ---"
          try {
            Start-Process "roblox-studio://diag-ticket-123"
            Write-Host "TES B: Start-Process TIDAK error"
          } catch {
            Write-Host "TES B: Start-Process ERROR: $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 15
          if (Test-Path $logFile) {
            Write-Host "TES B: LOG FILE ADA — isi:"
            Get-Content $logFile | ForEach-Object { Write-Host "LOG: $_" }
          } else {
            Write-Host "TES B: LOG FILE TIDAK ADA — receiver tidak pernah jalan"
          }
          Save-Shot "diag-protocol-tesB.png"
          Write-Host "TES B SELESAI."

      - name: Tes C — Picu lagi dengan URL bertiket realistis (oauth authorize)
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP "protocol-received.txt"
          Write-Host "=== TES C: Start-Process URL bertiket realistis ==="
          $ticketUrl = "roblox-studio://authorize?ticket=DIAGTEST123&returnUrl=https%3A%2F%2Fapis.roblox.com%2Foauth%2Fv1%2Fauthorize"
          Write-Host "URL: $ticketUrl"
          try {
            Start-Process $ticketUrl
            Write-Host "TES C: Start-Process TIDAK error"
          } catch {
            Write-Host "TES C: Start-Process ERROR: $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 15
          if (Test-Path $logFile) {
            Write-Host "TES C: isi log file:"
            Get-Content $logFile | ForEach-Object { Write-Host "LOG: $_" }
          } else {
            Write-Host "TES C: LOG FILE TIDAK ADA"
          }
          Write-Host "TES C SELESAI."

      - name: Upload artifact diagnosa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-protocol-v3
          path: |
            diag-protocol-*.png
          if-no-files-found: warn
